<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор постов: варианты — Kiva (макет)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

  <!--
    МАКЕТ для выбора, где открывать генератор постов:
    А — отдельная вкладка (post-page.html?id=...)
    Б — всплывающее окно поверх окна товара (та же страница внутри iframe)
  -->
  <style>
    :root {
      --bg: #FFF8F1;
      --white: #FFFFFF;
      --soft-peach: #FFE9DE;
      --soft-mint: #DDF6F1;
      --ink: #1E1A2E;
      --muted: #6E6880;
      --line: #EDE3D8;
      --coral: #FF5A4E;
      --coral-dark: #E8443A;
      --teal: #0FA39C;
      --sun: #FFC93C;
      --font-title: "Unbounded", system-ui, sans-serif;
      --font-text: "Manrope", system-ui, sans-serif;
      --radius: 20px;
      --radius-small: 12px;
      --shadow: 0 10px 30px rgba(30, 26, 46, .08);
      --shadow-big: 0 24px 60px rgba(30, 26, 46, .18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 var(--font-text);
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 48px; }

    h1 { font: 700 24px/1.3 var(--font-title); margin-bottom: 6px; }
    .lead { color: var(--muted); margin-bottom: 20px; }

    /* ---------- Переключатель вариантов ---------- */
    .switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .switch label {
      display: block;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
    }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch label:has(input:checked) { border-color: var(--coral); box-shadow: var(--shadow); }
    .switch b { display: block; font-family: var(--font-title); font-size: 15px; }
    .switch span { font-size: 14px; color: var(--muted); }

    /* ---------- Карточки товаров ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      border: none;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: transform .2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card__body { padding: 14px 18px 18px; }
    .card__name { font: 700 16px var(--font-title); }
    .card__meta { font-size: 14px; color: var(--muted); }
    .card__price { font-weight: 800; margin-top: 6px; }
    .card__price s { color: var(--muted); font-weight: 500; margin-left: 6px; }

    /* Заглушки текстур вместо фото */
    .swatch { height: 160px; }
    .tex-marble   { background: linear-gradient(135deg, #F4F1EC, #DCD6CE 40%, #F7F4EF 60%, #CFC8BE); }
    .tex-wood     { background: repeating-linear-gradient(90deg, #C49A6C 0 14px, #B58A5C 14px 22px, #CFA77A 22px 40px); }
    .tex-concrete { background: linear-gradient(135deg, #B9B6B1, #9F9C97 50%, #C4C1BC); }
    .tex-default  { background: linear-gradient(135deg, #E2C9A6, #C9A77E); }

    /* ---------- Всплывающие окна ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 26, 46, .45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay--open { display: flex; }
    #postOverlay { background: rgba(30, 26, 46, .3); }

    .modal {
      position: relative;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-big);
      width: 100%;
      max-width: 820px;
      max-height: calc(100vh - 32px);
      overflow: auto;
    }
    .modal--post { max-width: 560px; padding: 22px 22px 18px; }
    .modal__close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      font-size: 16px;
      cursor: pointer;
      z-index: 1;
    }

    .product {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .product .swatch { height: 100%; min-height: 280px; }
    .product__info { padding: 28px; }
    .product__name { font: 700 22px/1.3 var(--font-title); margin-bottom: 4px; }
    .product__meta { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .product__price { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    .product__price s { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .product__desc { margin-bottom: 20px; }

    .actions { display: flex; flex-direction: column; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: 700 15px var(--font-text);
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }
    .btn--primary { background: var(--coral); color: var(--white); }
    .btn--admin {
      background: var(--soft-mint);
      color: var(--ink);
      border: 1.5px dashed var(--teal);
    }
    .btn--admin small {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--teal);
    }

    .modal__title { font: 700 18px var(--font-title); margin: 0 40px 14px 0; }
    .modal__back {
      background: none;
      border: none;
      font: 600 14px var(--font-text);
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 6px;
    }
    .frame {
      display: block;
      width: 100%;
      height: min(70vh, 720px);
      border: none;
    }

    /* ---------- Телефон ---------- */
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .wrap { padding: 20px 16px 40px; }
      h1 { font-size: 20px; }
      .switch { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .product { grid-template-columns: 1fr; }
      .product .swatch { min-height: 160px; }
      .product__info { padding: 20px; }
      .overlay { padding: 0; align-items: flex-end; }
      .modal { max-height: 92vh; border-radius: var(--radius) var(--radius) 0 0; }
      .modal--post { padding: 18px 16px 12px; }
    }
  </style>
</head>
<body>

<main class="wrap">
  <h1>Где открывать генератор постов</h1>
  <p class="lead">Выберите вариант, откройте любой товар и нажмите «Пост для соцсетей».</p>

  <div class="switch">
    <label>
      <input type="radio" name="variant" value="tab" checked>
      <b>А — отдельная вкладка</b>
      <span>Генератор открывается на своей странице, каталог остаётся в старой вкладке</span>
    </label>
    <label>
      <input type="radio" name="variant" value="modal">
      <b>Б — всплывающее окно</b>
      <span>Генератор открывается поверх окна товара, страница не меняется</span>
    </label>
  </div>

  <div class="grid" id="grid"></div>
</main>

<!-- Окно товара -->
<div class="overlay" id="productOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Карточка товара">
    <button class="modal__close" data-close="productOverlay" aria-label="Закрыть">✕</button>
    <div id="productBody"></div>
  </div>
</div>

<!-- Окно генератора (вариант Б) -->
<div class="overlay" id="postOverlay">
  <div class="modal modal--post" role="dialog" aria-modal="true" aria-label="Пост для соцсетей">
    <button class="modal__close" data-close="postOverlay" aria-label="Закрыть">✕</button>
    <button class="modal__back" data-close="postOverlay">← к товару</button>
    <h2 class="modal__title" id="postTitle">Пост для соцсетей</h2>
    <iframe class="frame" id="postFrame" title="Генератор постов" allow="clipboard-write"></iframe>
  </div>
</div>

<script src="../site/products.js"></script>
<script>
  const SHOWN = PRODUCTS.slice(0, 3);
  const TEXTURES = ["marble", "wood", "concrete"];

  const texClass = (p) => "tex-" + (TEXTURES.includes(p.texture) ? p.texture : "default");
  const priceHtml = (p) => `${p.price} BYN/м²` + (p.oldPrice ? `<s>${p.oldPrice}</s>` : "");

  // Карточки каталога
  document.getElementById("grid").innerHTML = SHOWN.map(p => `
    <button class="card" data-id="${p.id}">
      <div class="swatch ${texClass(p)}"></div>
      <div class="card__body">
        <div class="card__name">${p.name}</div>
        <div class="card__meta">${p.brand} · ${p.format} см</div>
        <div class="card__price">${priceHtml(p)}</div>
      </div>
    </button>
  `).join("");

  const productOverlay = document.getElementById("productOverlay");
  const postOverlay = document.getElementById("postOverlay");
  const postFrame = document.getElementById("postFrame");

  document.getElementById("grid").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) openProduct(Number(card.dataset.id));
  });

  function openProduct(id) {
    const p = PRODUCTS.find(item => item.id === id);
    document.getElementById("productBody").innerHTML = `
      <div class="product">
        <div class="swatch ${texClass(p)}"></div>
        <div class="product__info">
          <div class="product__name">${p.name}</div>
          <div class="product__meta">${p.brand}, ${p.country} · ${p.type} · ${p.format} см</div>
          <div class="product__price">${priceHtml(p)}</div>
          <p class="product__desc">${p.description}</p>
          <div class="actions">
            <button class="btn btn--primary" type="button">В корзину</button>
            <button class="btn btn--admin" type="button" id="postBtn">
              Пост для соцсетей <small>менеджер</small>
            </button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("postBtn").addEventListener("click", () => openPost(p));
    productOverlay.classList.add("overlay--open");
  }

  function openPost(p) {
    const variant = document.querySelector("input[name=variant]:checked").value;
    if (variant === "tab") {
      window.open(`post-page.html?id=${p.id}`, "_blank");
    } else {
      document.getElementById("postTitle").textContent = `Пост: ${p.name}`;
      postFrame.src = `post-page.html?id=${p.id}&embed=1`;
      postOverlay.classList.add("overlay--open");
    }
  }

  // Закрытие: крестик, «к товару», клик по фону, Esc (сначала верхнее окно)
  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-close]");
    if (target) document.getElementById(target.dataset.close).classList.remove("overlay--open");
    if (e.target.classList.contains("overlay")) e.target.classList.remove("overlay--open");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const top = postOverlay.classList.contains("overlay--open") ? postOverlay : productOverlay;
    top.classList.remove("overlay--open");
  });
</script>
</body>
</html>
